version: "2"
sql:
  - engine: "postgresql"
    queries: "sqlc/queries"
    schema: "../db/migrations"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_pointers_for_null_types: true
